<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="webui-version" content="v18.4.8">
<title>玄戒O3 · Abel 调度工具箱</title>
<style>
/* ============================================================
   玄戒O3 · Abel 调度工具箱 —— WebUI 样式
   风格：iOS / Miuix 混合 —— 大圆角卡片、分组列表、胶囊按钮
   主题：跟随系统深浅色（MIUI/Miuix 的 prefers-color-scheme）
   ============================================================ */

:root {
  --bg:        #f2f3f7;
  --bg-elev:   #ffffff;
  --card:      #ffffff;
  --line:      rgba(0, 0, 0, .075);
  --line-soft: rgba(0, 0, 0, .045);
  --text:      #101114;
  --sub:       #8a8f99;
  --sub2:      #a9aeb8;
  --accent:    #0a84ff;
  --accent-2:  #3f9bff;
  --ok:        #24c07a;
  --warn:      #f2a33c;
  --bad:       #ff4d4f;
  --chip-bg:   rgba(120, 120, 128, .12);
  --shadow:    0 1px 2px rgba(16, 18, 24, .05), 0 8px 24px -12px rgba(16, 18, 24, .14);
  --radius:    16px;
  --radius-s:  11px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #0b0c0f;
    --bg-elev:   #14161a;
    --card:      #17191e;
    --line:      rgba(255, 255, 255, .09);
    --line-soft: rgba(255, 255, 255, .05);
    --text:      #f2f3f5;
    --sub:       #9aa0ab;
    --sub2:      #767c87;
    --accent:    #3f9bff;
    --accent-2:  #62b0ff;
    --ok:        #35d18b;
    --warn:      #ffb454;
    --bad:       #ff5c5e;
    --chip-bg:   rgba(120, 120, 128, .22);
    --shadow:    0 1px 2px rgba(0, 0, 0, .4);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "MiSans", "HarmonyOS Sans SC",
        "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

body { padding-bottom: 28px; }

.mono {
  font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  font-size: .92em;
}

/* ---------- 顶栏 ---------- */
header {
  position: sticky; top: 0; z-index: 30;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
header.scrolled { border-bottom-color: var(--line); }

.h-top { display: flex; align-items: center; gap: 9px; }
.h-top h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
.h-ver {
  font-size: 11px; color: var(--sub);
  background: var(--chip-bg); padding: 2px 8px; border-radius: 99px;
}
.h-chips { margin-left: auto; display: flex; align-items: center; gap: 6px; }
/* 头部「刷新」「应用」：等高对齐，刷新用 ghost、应用用 primary */
.h-chips .btn { display: inline-flex; align-items: center; justify-content: center; height: 28px; padding: 0 12px; flex: none; }
.h-chips .h-txt { color: var(--sub); }

.h-sub {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--sub); margin-top: 3px; min-height: 17px;
}
.h-sub #saved { margin-left: auto; }

.tabs {
  display: flex; gap: 4px; margin: 10px -16px 0; padding: 0 16px 9px;
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: none; border: 0; background: transparent; color: var(--sub);
  font: inherit; font-size: 14px; font-weight: 500;
  padding: 7px 13px; border-radius: 99px; cursor: pointer;
  transition: background .16s, color .16s;
}
.tabs button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }

main { padding: 14px 16px 0; }

/* ---------- 分组 ---------- */
.group { margin-bottom: 20px; }
.g-title {
  font-size: 12.5px; font-weight: 600; color: var(--sub);
  padding: 0 4px 7px; letter-spacing: .2px;
}
.g-title.rowhead { display: flex; align-items: center; gap: 10px; }
.g-title.rowhead .btn { flex: none; margin-left: auto; }
.g-foot { font-size: 12px; color: var(--sub); line-height: 1.6; padding: 8px 4px 0; }
.g-foot b { color: var(--text); font-weight: 600; }

.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.card > .row + .row { border-top: 1px solid var(--line-soft); }

.row { display: flex; align-items: center; gap: 12px; padding: 13px 15px; }
.row.tappable { cursor: pointer; }
.row.tappable:active { background: var(--line-soft); }
.r-main { flex: 1; min-width: 0; }
.r-t { font-size: 14.5px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
.r-s { font-size: 12.5px; color: var(--sub); margin-top: 2px; line-height: 1.45; word-break: break-all; }
.r-s .mono { color: var(--sub); }

.kv-row { display: flex; align-items: baseline; gap: 12px; padding: 11px 15px; }
.kv-row + .kv-row { border-top: 1px solid var(--line-soft); }
.kv-row .k { font-size: 13.5px; color: var(--text); flex: none; }
.kv-row .k.mono { color: var(--sub); }
.kv-row .v { margin-left: auto; font-size: 13.5px; color: var(--sub); text-align: right; word-break: break-all; }

.empty { padding: 26px 16px; text-align: center; color: var(--sub); font-size: 13.5px; }

/* ---------- 圆点 / 胶囊 ---------- */
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.d-ok { background: var(--ok); } .d-warn { background: var(--warn); } .d-bad { background: var(--bad); }

.pill {
  font-size: 11.5px; font-weight: 500; padding: 2.5px 8px; border-radius: 99px;
  background: var(--chip-bg); color: var(--sub); white-space: nowrap;
}
.pill.ok     { background: color-mix(in srgb, var(--ok) 16%, transparent);   color: var(--ok); }
.pill.warn   { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad    { background: color-mix(in srgb, var(--bad) 16%, transparent);  color: var(--bad); }
.pill.accent { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }

/* ---------- 按钮 ---------- */
.btn {
  appearance: none; border: 0; cursor: pointer;
  font: inherit; font-size: 14px; font-weight: 500;
  padding: 10px 16px; border-radius: 12px;
  background: var(--chip-bg); color: var(--text);
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.975); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger  { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.btn.ghost   { background: transparent; color: var(--accent); }
.btn[disabled] { opacity: .38; pointer-events: none; }
.btn-row { display: flex; gap: 9px; padding: 12px 15px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; min-width: 108px; }
.btn-xs { font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 9px; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 12px 15px; }

/* ---------- 表单 ---------- */
input.f, select.f, textarea.f {
  font: inherit; font-size: 14px; color: var(--text);
  background: var(--chip-bg); border: 0; border-radius: 10px;
  padding: 9px 12px; outline: none; min-width: 0; width: 100%;
}
select.f { appearance: none; -webkit-appearance: none; }
textarea.f { resize: vertical; line-height: 1.5; }

.sw { position: relative; display: inline-block; width: 47px; height: 29px; flex: none; }
.sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; }
.sw i {
  position: absolute; inset: 0; border-radius: 99px;
  background: var(--chip-bg); transition: background .2s;
}
.sw i::after {
  content: ''; position: absolute; top: 2.5px; left: 2.5px;
  width: 24px; height: 24px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .28); transition: transform .2s;
}
.sw input:checked + i { background: var(--ok); }
.sw input:checked + i::after { transform: translateX(18px); }

/* ---------- 提示条 ---------- */
.warnbox {
  margin: 0 15px 12px; padding: 11px 13px; border-radius: 12px;
  font-size: 12.5px; line-height: 1.6;
  background: color-mix(in srgb, var(--warn) 11%, transparent);
  color: var(--text);
}
.warnbox.bad { background: color-mix(in srgb, var(--bad) 11%, transparent); }
.warnbox.ok  { background: color-mix(in srgb, var(--ok) 11%, transparent); }
.warnbox b { font-weight: 600; }

/* ---------- 模式卡片 ---------- */
.modegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modecard {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 13px 14px; cursor: pointer;
  border: 1.5px solid transparent;
  transition: border-color .15s, background .15s, transform .1s;
}
.modecard:active { transform: scale(.985); }
.modecard.on {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 9%, var(--card));
}
.mc-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.mc-n { font-size: 16px; font-weight: 700; flex: 1; }
.mc-b { font-size: 12px; color: var(--sub); line-height: 1.7; }
.mc-b b { color: var(--text); font-weight: 600; }

/* ---------- 频率行 ---------- */
.freqrow { display: flex; align-items: baseline; gap: 12px; padding: 11px 15px; }
.freqrow + .freqrow { border-top: 1px solid var(--line-soft); }
.freqrow .fn { font-size: 13.5px; color: var(--text); flex: none; width: 54px; }
.freqrow .fv { margin-left: auto; font-size: 13px; color: var(--sub); text-align: right; }
.freqrow .fv b { color: var(--text); font-weight: 600; }

/* ---------- 各模式频率档位编辑器 ---------- */
.freqmode { border-top: 1px solid var(--line-soft); }
.freqmode:first-child { border-top: 0; }
.freqmode.cur > .freqmode-h { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.freqmode-h { display: flex; align-items: center; gap: 10px; padding: 13px 15px; cursor: pointer; }
.freqmode-h:active { background: var(--line-soft); }
.freqmode.on .freqmode-h { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.fmode-t { flex: 1; min-width: 0; }
.freqmode-caret { color: var(--sub); transition: transform .28s cubic-bezier(.4, 0, .2, 1); flex: none; }
.freqmode.on .freqmode-caret { transform: rotate(180deg); color: var(--accent); }
/* 展开动画：max-height + opacity 过渡，避免 display 切换导致的布局跳动 */
.freqmode-body {
  max-height: 0; overflow: hidden; opacity: 0;
  padding: 0 15px;
  transition: max-height .28s cubic-bezier(.4, 0, .2, 1), opacity .2s ease, padding .28s ease;
}
.freqmode.on .freqmode-body {
  opacity: 1; padding: 6px 15px 16px;
  background: color-mix(in srgb, var(--accent) 4%, transparent);
  box-shadow: inset 0 1px 0 var(--line-soft);
}
.freq3 { display: flex; align-items: center; gap: 7px; padding: 7px 0; flex-wrap: wrap; }
.freq3 + .freq3 { border-top: 1px dashed var(--line-soft); }
.f3-n { font-size: 13.5px; font-weight: 600; width: 46px; flex: none; }
.f3-l { font-size: 11.5px; color: var(--sub); }
.f3-s { width: auto; flex: 1; min-width: 96px; }
.freqmode-actions { display: flex; gap: 9px; margin-top: 12px; }
.freqmode-actions .btn { flex: 1; }

/* ---------- 线程：选择栏 / 模板栏 ---------- */
.selbar { display: flex; align-items: center; gap: 8px; padding: 8px 0 4px; flex-wrap: wrap; }
/* 模板直选行：勾选应用后点模板名即套用，不用二级菜单 */
.tplrow { display: flex; flex-wrap: wrap; gap: 7px; padding: 9px 0 3px; }
.tplrow-label { flex: 1 0 100%; font-size: 11.5px; color: var(--sub); padding: 0 0 5px; }
.tplbtn:disabled { opacity: .4; cursor: not-allowed; }
.tplbtn { flex: 1; min-width: 62px; text-align: center; }
/* ---------- 档位选择：底部弹层（替代原生 select 的系统级全屏菜单） ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.42); opacity: 0; transition: opacity .22s; z-index: 80; }
.sheet-bg.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg-elev); border-radius: 16px 16px 0 0;
  transform: translateY(100%); transition: transform .26s cubic-bezier(.4,0,.2,1); z-index: 81; max-height: 72vh; display: flex; flex-direction: column; }
.sheet.on { transform: translateY(0); }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--line-soft); }
.sheet-h .t { font-size: 15px; font-weight: 600; }
.sheet-b { overflow-y: auto; padding: 6px 8px 14px; }
.sheet-item { padding: 13px 12px; border-radius: 11px; cursor: pointer; }
.sheet-item.on { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.sheet-item .si-n { font-size: 14.5px; }
.sheet-item .si-s { font-size: 11.5px; color: var(--sub); margin-top: 2px; }
.modebtn { width: auto; flex: none; min-width: 96px; font-size: 12.5px; padding: 6px 8px; }
/* 搜索 + 预设筛选：一行两控件，等高对齐 */
.toolrow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.toolrow .f { flex: 1; min-width: 0; }
.sel-tpl { width: auto; flex: none; min-width: 96px; font-size: 12.5px; padding: 6px 8px; }
/* 功能（艇长特性）网格：两列，标签左、开关右，对齐不挤 */
.feat-block { padding: 12px 15px 4px; border-top: 1px solid var(--line-soft); }
.feat-title { font-size: 12px; font-weight: 600; color: var(--sub); margin-bottom: 9px; }
.feat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.feat-item { display: flex; align-items: center; gap: 8px; min-width: 0; }
.feat-item .feat-lbl { font-size: 12.5px; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feat-item .feat-val { font-size: 12.5px; color: var(--accent); font-weight: 600; }
.sw.sw-sm { width: 36px; height: 21px; }
.sw.sw-sm i::after { top: 2px; left: 2px; width: 17px; height: 17px; }
.sw.sw-sm input:checked + i::after { transform: translateX(15px); }
.app-sel { width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
.app-row.sel { background: color-mix(in srgb, var(--accent) 8%, var(--card)); }

/* ---------- 应用列表「窗口」：固定高度可滚动 + 筛选条 ---------- */
.apptoolbar { padding: 10px 15px 4px; }
.apptoolbar .f { margin-bottom: 8px; }
/* 筛选 chips：横向滚动，不换行 */
.chiprow {
  display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none;
  padding: 2px 0 6px; -webkit-overflow-scrolling: touch;
}
.chiprow::-webkit-scrollbar { display: none; }
.fchip {
  flex: none; border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 500;
  padding: 5px 12px; border-radius: 99px; background: var(--chip-bg); color: var(--sub);
  white-space: nowrap; transition: background .15s, color .15s;
}
.fchip.on { background: var(--accent); color: #fff; }
/* 可滚动窗口：约 5-7 行高度，内部滑动加载 */
.appwin {
  max-height: 332px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}
.appwin .row { padding: 11px 15px; }
.appwin .empty { padding: 22px 16px; }
.winmore { padding: 11px 16px; text-align: center; color: var(--sub); font-size: 12.5px; }
.winmore.loading { color: var(--accent); }

/* ---------- 应用行：图标 + 名称 + 包名 + 标签 ---------- */
.app-row .ai {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  object-fit: cover; background: rgba(140,150,170,.18);
}
.app-row .ai.letter {
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff; background: var(--accent);
}
.app-row .app-main { min-width: 0; flex: 1; }
.app-row .app-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-row .app-pkg { font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 图标懒加载包裹：首屏只画字母头像，滚到可见才拉 ksu://icon，失败回退字母 */
.app-row .ai-wrap { position: relative; width: 34px; height: 34px; flex: none; }
.app-row .ai-wrap .ai { position: absolute; inset: 0; width: 100%; height: 100%; }
.app-row .tagrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.selcount { font-size: 12.5px; color: var(--sub); margin-right: 2px; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; left: 0; right: 0; bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  margin: 0 auto; width: -webkit-fit-content; width: fit-content;
  z-index: 90;
  max-width: 84vw; padding: 11px 18px; border-radius: 13px;
  background: rgba(20, 21, 26, .94); color: #fff;
  font-size: 13.5px; line-height: 1.45; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
  will-change: opacity;
}
@media (prefers-color-scheme: dark) { #toast { background: rgba(240, 241, 245, .96); color: #101114; } }
#toast.on { opacity: 1; }

/* ---------- 加载指示 ---------- */
.spin {
  display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
  border: 2px solid var(--chip-bg); border-top-color: var(--accent);
  border-radius: 50%; animation: sp .7s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }

.hidden { display: none !important; }
</style>
</head>

<body>

<header>
  <div class="h-top">
    <h1>调度工具箱</h1>
    <span class="h-ver" id="ver">18.2.8</span>
    <div class="h-chips">
      <button class="btn btn-xs ghost h-txt" data-act="reload" title="重新读取当前页">刷新</button>
      <button class="btn btn-xs primary" id="conn-chip" data-act="apply" title="保存当前页所有变更并应用">应用</button>
    </div>
  </div>
  <div class="h-sub">
    <span>玄戒O3 · 4+4+2</span>
    <span>·</span>
    <span id="saved"></span>
  </div>
  <nav class="tabs">
    <button data-tab="freq" class="on">全局</button>
    <button data-tab="app">应用</button>
    <button data-tab="game">游戏</button>
  </nav>
</header>

<main>
  <div id="demo-banner" class="group hidden">
    <div class="card"><div class="warnbox bad" style="margin:12px 15px">
      <b>演示模式</b>：没有连上 KernelSU 的 WebUI 桥，当前是内置样例数据，
      <b>任何「保存 / 开关」都不会真正写入</b>。<br>
      请从 <b>KernelSU / SukiSU 管理器 → 模块 → 玄戒O3 · Abel 调度工具箱 → 打开</b> 进入本页。
    </div></div>
  </div>
  <div id="view"></div>
</main>

<div id="toast"></div>

<script>
/* ============================================================
   玄戒O3 · Abel 调度工具箱 —— WebUI 前端（全局频率 + 应用 / 游戏）
     ① 全局：选方案 + 选全局模式 → 频率下发
     ② 应用：给应用设「频率档 + 线程档」（一次写 app_assign → applist.conf）
     ③ 游戏：游戏固定走大核线程（hp-core），这里只选频率档
     · 未定义配置的兜底：频率跟随全局、线程用「流畅」
     · 精细线程规则（块语法/通配线程）→「全局」页按钮打开 AppOpt 网页 8889
   ============================================================ */
'use strict';

const MOD_ID = 'O3CPUSet';
const STATE_DIR = '/data/adb/O3CPUSet';
const MODDIR = '/data/adb/modules/' + MOD_ID;
const SCRIPT = MODDIR + '/Scripts/4+4+2/O3/webui.sh';

/* ============================================================
   1) Bridge —— KernelSU 原生桥适配
   ============================================================ */
const Bridge = {
  K: null, execMode: '', isRoot: true, probes: [], _n: 0,
  detect() { this.K = window.ksu || window.kernelsu || null; return !!this.K; },
  keys() { if (!this.K) return []; try { return Object.keys(this.K); } catch (e) { return []; } },
  has(fn) { return !!(this.K && typeof this.K[fn] === 'function'); },
  _official(cmd, timeout) {
    return new Promise(res => {
      const name = '__ksucb_' + (++this._n) + '_' + Date.now();
      let done = false;
      const fin = r => { if (!done) { done = true; try { delete window[name]; } catch (e) { } res(r); } };
      window[name] = (errno, stdout, stderr) => fin({
        code: parseInt(errno, 10) || 0,
        out: String(stdout == null ? '' : stdout) + String(stderr == null ? '' : stderr)
      });
      try { this.K.exec(cmd, JSON.stringify({}), name); }
      catch (e) { fin({ code: 1, out: 'ERR ' + e }); }
      setTimeout(() => fin({ code: 1, out: 'ERR^no-callback' }), timeout);
    });
  },
  _cbFn(cmd, timeout) {
    return new Promise(res => {
      let done = false;
      const fin = r => { if (!done) { done = true; res(r); } };
      try {
        this.K.exec(cmd, (a, b, c) => fin({
          code: typeof a === 'number' ? a : 0,
          out: (typeof a === 'string' ? a : '') + String(b == null ? '' : b) + String(c == null ? '' : c)
        }));
      } catch (e) { fin({ code: 1, out: 'ERR ' + e }); }
      setTimeout(() => fin({ code: 1, out: 'ERR^no-callback' }), timeout);
    });
  },
  _promise(cmd, timeout) {
    try {
      const p = this.K.exec(cmd);
      if (!p || typeof p.then !== 'function') return { code: 1, out: 'ERR^not-promise' };
      const r = Promise.race([p, new Promise(x => setTimeout(() => x('ERR^timeout'), timeout))]);
      return Promise.resolve(r).then(rr => {
        if (rr === 'ERR^timeout') return { code: 1, out: 'ERR^timeout' };
        if (typeof rr === 'string') return { code: 0, out: rr };
        if (rr && typeof rr === 'object')
          return { code: (rr.errno | 0) || (rr.code | 0) || 0, out: String(rr.stdout || '') + String(rr.stderr || '') + String(rr.output || '') };
        return { code: 0, out: String(rr == null ? '' : rr) };
      });
    } catch (e) { return { code: 1, out: 'ERR ' + e }; }
  },
  async probe() {
    if (!this.detect()) { this.execMode = 'demo'; return 'demo'; }
    const cands = [['official', (c, t) => this._official(c, t)], ['cb', (c, t) => this._cbFn(c, t)], ['promise', (c, t) => this._promise(c, t)]];
    for (const [name, fn] of cands) {
      const r = await fn('echo __ksu_probe', 3000);
      if (/__ksu_probe/.test(r.out || '')) { this.execMode = name; break; }
    }
    if (!this.execMode) this.execMode = 'demo';
    try { const r = await this.exec('id -u'); this.isRoot = String(r.out || '').trim() === '0'; } catch (e) { }
    return this.execMode;
  },
  async exec(cmd) {
    switch (this.execMode) {
      case 'official': return this._official(cmd, 60000);
      case 'cb': return this._cbFn(cmd, 60000);
      case 'promise': return this._promise(cmd, 60000);
      default: return Demo.exec(cmd);
    }
  },
  toast(m) { try { if (this.has('toast')) { this.K.toast(String(m)); return true; } } catch (e) { } return false; },
  // 批量取应用元信息（label / 是否系统 / 图标 URL）。
  //   优先用 KSU 官方桥 Api.getPackagesInfo（直接给 appLabel，图标走 ksu://icon）；
  //   仅在 official 形状且方法存在时走这条路，其它形状/无方法则回退后端 aapt 兜底。
  async pkgInfo(pkgs) {
    const list = pkgs.filter(Boolean);
    if (!list.length) return {};
    const norm = (raw) => {
      // KernelSU 官方桥 getPackagesInfo 可能回 JSON 字符串，也可能回数组
      let arr = raw;
      if (typeof arr === 'string') { try { arr = JSON.parse(arr); } catch (e) { arr = null; } }
      if (!Array.isArray(arr)) return null;
      const m = {};
      arr.forEach(it => {
        if (!it || !it.packageName) return;
        m[it.packageName] = {
          label: it.appLabel || it.packageName,
          sys: it.isSystem ? 1 : 0,
          icon: 'ksu://icon/' + it.packageName
        };
      });
      return m;
    };
    if (this.execMode === 'official' && this.has('getPackagesInfo')) {
      try {
        // 优先回调式（官方签名 getPackagesInfo(pkgs, cb)）；失败再试 Promise 式
        const raw = await new Promise((res, rej) => {
          let settled = false;
          const fin = (v) => { if (!settled) { settled = true; res(v); } };
          try {
            const r = this.K.getPackagesInfo(list, (v) => fin(v));
            if (r && typeof r.then === 'function') r.then(fin, rej);
            else if (r !== undefined && r !== null) fin(r);
          } catch (e) { rej(e); }
          setTimeout(() => fin(null), 8000);
        });
        const m = norm(raw);
        if (m && Object.keys(m).length) {
          list.forEach(p => { if (!m[p]) m[p] = { label: p, sys: 0, icon: '' }; });
          return m;
        }
      } catch (e) { /* 落到 aapt 兜底 */ }
    }
    // 回退：后端 aapt 解析 label + pm path 判系统/第三方
    try {
      const text = await Api.pkginfo(list.join('\n'));
      const m = {};
      String(text).split('\n').forEach(l => {
        if (l.indexOf('PKG=') !== 0) return;
        const rest = l.slice(4); const i = rest.indexOf('\t');
        if (i < 0) return;
        const pkg = rest.slice(0, i); const tail = rest.slice(i + 1).split('\t');
        m[pkg] = { label: tail[0] || pkg, sys: tail[1] === '1' ? 1 : 0, icon: '' };
      });
      list.forEach(p => { if (!m[p]) m[p] = { label: p, sys: 0, icon: '' }; });
      return m;
    } catch (e) {
      const m = {}; list.forEach(p => m[p] = { label: p, sys: 0, icon: '' }); return m;
    }
  }
};

/* ============================================================
   2) Api —— 调 webui.sh 后端（唯一写入口）
   ============================================================ */
const Api = {
  shq(s) { return /[^\w@%+=:,./-]/.test(s) ? "'" + String(s).replace(/'/g, "'\\''") + "'" : s; },
  build(cmd) { const c = 'sh ' + SCRIPT + ' ' + cmd; return Bridge.isRoot ? c : 'su -c ' + this.shq(c); },
  async raw(cmd) { return await Bridge.exec(this.build(cmd)); },
  async run(cmd) { const r = await this.raw(cmd); return r.out == null ? '' : r.out; },
  _kv(text) {
    const m = {};
    String(text || '').split('\n').forEach(line => {
      const i = line.indexOf('=');
      if (i > 0) m[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    });
    return m;
  },
  async status() { return this._kv(await this.run('status')); },
  async schemes() { return String(await this.run('schemes')).split('\n').filter(Boolean); },
  async scheme(name) { return await this.run('scheme ' + this.shq(name)); },
  async mode() { return this._kv(await this.run('mode')); },
  async modeset(mode) { return await this.run('modeset ' + this.shq(mode)); },
  async freqs() { return this._kv(await this.run('freqs')); },
  async freqview() { return this._kv(await this.run('freqview')); },
  async freqsave(b64) { return await this.run('freqsave ' + this.shq(b64)); },
  async frequse(mode, b64) { return await this.run('frequse ' + this.shq(mode) + ' ' + this.shq(b64)); },
  async live() { return await this.run('live'); },
  async ensureguard() { return await this.run('ensureguard'); },
  async pkginfo(pkgs) { return await this.run('pkginfo ' + this.shq(pkgs)); },
  // 分应用频率：每应用一个模式档
  async appfreq() { return await this.run('appfreq'); },
  async appfreqapps() { return await this.run('appfreqapps'); },
  async appfreqset(pkg, mode) { return await this.run('appfreqset ' + this.shq(pkg) + ' ' + this.shq(mode)); },
  async appfreqdel(pkg) { return await this.run('appfreqdel ' + this.shq(pkg)); },
  async appfreqbatch(b64) { return await this.run('appfreqbatch ' + this.shq(b64)); },
  // ★ v18.3.9：应用/游戏 统一设置（一次写 频率 + 线程）。
  //   kind=app：频率写 app_freq，线程按 freq2tpl 映射（极速→不接管）。
  //   kind=game：频率写 game_assign，线程固定 game。
  async appset(pkg, mode, kind) { return await this.run('appset ' + this.shq(pkg) + ' ' + this.shq(mode) + ' ' + this.shq(kind)); },
  // ★ 批量（「应用 / 游戏」页实际调用）：b64(pkg<TAB>mode 多行) + kind(app|game)
  //   ⚠ 必须存在！前端多处调 Api.appsetbatch，缺了会静默失败 → 保存后刷新即回退。
  async appsetbatch(b64, kind) { return await this.run('appsetbatch ' + this.shq(b64) + ' ' + this.shq(kind || 'app')); },
  async appdel(pkg, kind) { return await this.run('appdel ' + this.shq(pkg) + ' ' + this.shq(kind)); },
  async gamefreq() { return await this.run('gamefreq'); },
  async games() { return await this.run('games'); },
  // 线程接管（艇长 Aether）
  async aether() { return await this.run('aether'); },
  async aetherswitch(onoff) { return await this.run('aetherswitch ' + this.shq(onoff)); },
  async aetherapps() { return await this.run('aetherapps'); },
  async aetherset(pkg, tpl) { return await this.run('aetherset ' + this.shq(pkg) + ' ' + this.shq(tpl)); },
  async aetherdel(pkg) { return await this.run('aetherdel ' + this.shq(pkg)); },
  // v19：Aether 特性开关已随引擎切换移除；保留空实现避免残留调用报错。
  async aetherfeat(k, v) { return 'OK （特性开关已随引擎切换移除）'; },
  async aethersetbatch(b64) { return await this.run('aethersetbatch ' + this.shq(b64)); }
};

function b64enc(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64dec(b64) {
  const clean = (b64 || '').replace(/\s+/g, '');
  if (!clean) return '';
  const bin = atob(clean); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

            '<span class="f3-l">最高</span><select class="f f3-s" data-m="' + m + '" data-k="' + k + '" data-fk="max">' + freqOptions(steps, vmax) + '</select>' +
          '</div>';
        }).join('') +
        '<div class="freqmode-actions">' +
          '<button class="btn btn-xs ghost" data-act="freqreset" data-mode="' + m + '">恢复默认</button>' +
          '<button class="btn btn-xs" data-act="freqsave" data-mode="' + m + '">保存</button>' +
          '<button class="btn btn-xs primary" data-act="freqapply" data-mode="' + m + '">应用</button>' +
        '</div>' +
      '</div>';
    return '<div class="freqmode' + on + '" id="freqmode-' + m + '">' +
      '<div class="freqmode-h" data-act="freqtoggle" data-mode="' + m + '">' +
        '<div class="fmode-t"><div class="mc-n">' + esc(cn) + (curMode === m ? ' <span class="pill ok" style="font-size:10px">当前</span>' : '') + '</div>' +
        '<div class="mc-b">小 ' + fmtFreq(lmin) + '~' + fmtFreq(lmax) + ' · 中 ' + fmtFreq(mmin) + '~' + fmtFreq(mmax) + ' · 大 ' + fmtFreq(pmin) + '~' + fmtFreq(pmax) + '</div></div>' +
        '<span class="freqmode-caret">▾</span>' +
      '</div>' + body + '</div>';
  }).join('');
}

function collectTier(m) {
  const idx = { L: 0, M: 1, P: 2 };
  const vals = [0, 0, 0, 0, 0, 0];
  document.querySelectorAll('#freqmode-' + m + ' select[data-m="' + m + '"]').forEach(sel => {
    const k = sel.dataset.k, fk = sel.dataset.fk, i = idx[k] * 2 + (fk === 'max' ? 1 : 0);
    vals[i] = sel.value;
  });
  // 每簇保证 最低<=最高（拖错也不会把反置值写进去导致冻屏）
  for (let c = 0; c < 3; c++) {
    const lo = +vals[c * 2], hi = +vals[c * 2 + 1];
    if (lo > hi) { vals[c * 2] = hi; vals[c * 2 + 1] = lo; }
  }
  return m + '\t' + vals.join(' ');
}

// 顶部「应用」→ 频率页：把四个模式的档位全部写盘 + 以当前全局模式下发

async function loadAppFreq() {
  try {
    // 后端 cmd_appfreq 返回形如：AF_<pkg>=<mode> 行 + 一行 AF_N=<数量>。
    // 这里解析成 { pkg: mode } 对象，供 renderAppFreq 判定「已配置 / 当前档」。
    const t = await Api.appfreq();
    const m = {};
    const wild = [];   // ★ v18.4.8：后端为压缩规则会把同前缀子进程合并成 `xxx*`（如 sandboxed_privilege_process*），
                       //   前端若只用精确名查就会读不到、界面回显旧档。这里单独收集通配键用于前缀匹配。
    String(t).split('\n').forEach(l => {
      if (l.indexOf('AF_') === 0 && l.indexOf('=') > 3) {
        const i = l.indexOf('=');
        const k = l.slice(3, i);
        const v = l.slice(i + 1).trim();
        m[k] = v;
        if (k.indexOf('*') >= 0) wild.push([k, v]);
      }
    });
    S.appfreq = m;
    S.appfreqWild = wild;
  } catch (e) { S.appfreq = {}; S.appfreqWild = []; }
}
// ★ v18.4.8：取某包的生效频率档 = 精确优先，其次匹配后端通配符键（xxx*）。
function appFreqOf(pkg) {
  const m = S.appfreq || {};
  if (m[pkg]) return m[pkg];
  const wild = S.appfreqWild || [];
  for (let i = 0; i < wild.length; i++) {
    const k = wild[i][0];
    const star = k.indexOf('*');
    if (star < 0) continue;
    const prefix = k.slice(0, star);
    if (pkg.indexOf(prefix) === 0) return wild[i][1];
  }
  return '';
}
// ★ v19.0.5：保存后**精准更新**某包的模式按钮 + 行内「同步 · 线程X」pill，
//   不再整页重渲（应用页 ~198 行，旧逻辑每次保存要重渲 3~4 次，是「保存中要等很久」的主因之一）。
//   有筛选/搜索时行集合会变，交由调用方回退到整页 renderAppFreq()。
function refreshModeButtons(pkg) {
  const cur = appFreqOf(pkg);
  const cn = (APP_MODE_OPTS.find(o => o[0] === cur) || ['', '跟随全局'])[1];
  const tplCn = { powersave: '省电', balance: '流畅', performance: '性能', fast: '不接管', '': '' }[cur] || '';
  const q = pkg.replace(/["\\]/g, '\\$&');
  document.querySelectorAll('[data-appset="' + q + '"]').forEach(b => { b.textContent = cn; b.dataset.cur = cur; });
  document.querySelectorAll('[data-merge="' + q + '"]').forEach(b => { b.textContent = cn; b.dataset.cur = cur; });
  document.querySelectorAll('.app-row').forEach(row => {
    const b = row.querySelector('[data-appset],[data-merge]');
    if (!b) return;
    if ((b.dataset.appset || b.dataset.merge) !== pkg) return;
    const tagrow = row.querySelector('.tagrow');
    if (!tagrow) return;
    let pill = tagrow.querySelector('.pill');
    if (cur) {
      if (!pill) { pill = document.createElement('span'); pill.className = 'pill ok'; tagrow.appendChild(pill); }
      pill.className = 'pill ok'; pill.textContent = '同步 · 线程' + tplCn;
    } else if (pill) {
      pill.className = 'pill';
      pill.textContent = b.dataset.merge ? ('含 ' + ((S.mergeGroups || []).find(g => g.key === b.dataset.merge) || { members: [] }).members.length + ' 个进程') : '';
    }
  });
}
async function loadAppList() {
  if (!S.appList) {

    S.selSet = new Set();
  }
  // ★ v18.3.9：应用页也需游戏集合（排除游戏）+ 小程序归并（基于本页列表）。
  if (!S.games || S.games.size === 0) {
    try {
      const gt = await Api.games();
      S.games = new Set(String(gt).split('\n').filter(l => l.indexOf('GAME=') === 0).map(l => l.slice(5).trim()).filter(Boolean));
    } catch (e) { S.games = S.games || new Set(); }
  }
  // 归并基于应用页实际列表（appList），而非线程页的 apps
  S.mergeGroups = buildMergeGroups(S.appList || []);
}
function parseAppList(text) {
  // 与线程页一致：APP=pkg|sys(0/1)；附 applied=1 表示该应用已设分应用频率
  return String(text || '').split('\n').filter(l => l.indexOf('APP=') === 0)
    .map(l => { const f = l.slice(4).split('|'); return { pkg: f[0] || '', sys: f[1] || '0' }; })
    .filter(a => a.pkg);
}

/* ============================================================
   搜索补全：解决「搜不到应用」
   ------------------------------------------------------------
   病根（v18.3.8 实测修正）：搜索框过去只在 `pkg + Meta.cache[label]` 里匹配，
   而 Meta.cache 是**懒加载**的 —— 只有滚动到可见切片的应用才会被 hydrate 补上中文名。
   于是 170+ 个应用里绝大多数 label 仍是空，搜「酷安」「微信」这种中文词
   永远命中 0 条，用户只能看到"搜不到应用"。
   注意：这**不是**"等列表加载完就会好" —— 列表是分页懒加载的，等一辈子也不会全有。

   修法（两层）：
     ① 包名粗筛：先用包名做一次无依赖匹配，保证输入即有结果，不用等补全。
     ② 候选集强制补全：粗筛命中的一律走 hydrateSearch，把 label 真正拉回来再匹配，
        匹配完自动重渲染——用户看到的是「先出现包名命中项，label 到位后自动变中文名」。
   ============================================================ */
const Search = {
  _t: null,
  _lastKw: '',
  _token: 0,
  // 输入去抖：连续敲字只跑最后一轮，避免每敲一下就发一批 pkginfo
  schedule(kind) {
    clearTimeout(this._t);
    this._t = setTimeout(() => this.run(kind), 220);
  },
  async run(kind) {
    const kw = (kind === 'thread' ? (S.appsearch || '') : (S.appSearch || '')).trim().toLowerCase();
    if (!kw) { this._lastKw = ''; return; }
    const my = ++this._token;
    this._lastKw = kw;
    let src = kind === 'thread' ? (S.apps || []) : (S.appList || []);
    // ① 包名粗筛（无依赖，立刻有结果）
    let cand = src.filter(a => a.pkg && a.pkg.toLowerCase().indexOf(kw) >= 0);
    if (cand.length < 60) {
      // 粗筛太少时，把尚未 hydrate 的也纳入候选（上限 80，避免一次 aapt 172 个卡死）
      const seen = new Set(cand.map(a => a.pkg));
      for (const a of src) {
        if (cand.length >= 80) break;
        if (!a.pkg || seen.has(a.pkg)) continue;
        if (!Meta.cache[a.pkg]) { seen.add(a.pkg); cand.push(a); }
      }
    }
    if (!cand.length) return;
    // ② 强制补全候选集 label（命中缓存的跳过）
    const need = cand.map(a => a.pkg).filter(p => p && !Meta.cache[p]);
    if (need.length) { try { await Meta.load(need); } catch (e) { } }
    // 期间用户可能又改了关键词/切了页 → 丢弃过期结果，别把界面刷乱
    if (my !== this._token) return;
    if (kind === 'thread') renderApps(true);
    else renderAppFreq(true, true);
    observeIcons(kind === 'thread' ? 'apps-card' : 'appfreq-win');
  },
  // 过滤阶段的通用判定：中文名缺失时**不直接判死**，
  //   交给上面的补全流程再定位；这样「先出包名、后补中文名」才成立。
  hit(pkg, kw) {
    if (!kw) return true;
    const meta = Meta.cache[pkg] || {};
    const hay = (pkg + ' ' + (meta.label || '')).toLowerCase();
    return hay.indexOf(kw) >= 0;
  }
};

function appfreqFiltered() {
  const m = S.appfreq || {};
  const kw = (S.appSearch || '').trim().toLowerCase();
  const pf = S.appPresetFilter || 'all';
  // ★ v18.4：归并块里的「子进程（带冒号）」不再在主列表重复出现；
  //   但父包主进程（无冒号）仍保留在主列表，否则搜索父包名（微信/支付宝）会搜不到本体。
  const mergePkgs = new Set();
  (S.mergeGroups || []).forEach(g => (g.members || []).forEach(p => { if (p.indexOf(':') >= 0) mergePkgs.add(p); }));
  return (S.appList || []).filter(a => {
    // ★ v18.3.9：应用页不显示游戏（游戏在「游戏」页专属）
    if (S.games && S.games.has(a.pkg)) return false;
    // ★ 带冒号子进程只在「微信/支付宝小程序」归并块展示，绝不作为独立行出现在主列表
    //   （既防住后端偶发漏过滤的子进程，也杜绝列表里冒出一堆 `pkg:sub` 行导致卡顿）
    if (a.pkg.indexOf(':') >= 0) return false;
    // ★ v18.4：小程序归并块的子进程（带冒号）不在主列表重复
    if (mergePkgs.has(a.pkg)) return false;
    // ★ v18.4.2：搜索走 Search.hit（匹配包名 + Meta 中文名），父包主进程不再被归并块排除，搜「微信/支付宝」可命中本体。
    if (kw && !Search.hit(a.pkg, kw)) return false;
    // 按频率预设筛选：跟随全局=未设置；其余=已设为该档
    if (pf !== 'all') {
      const cur = appFreqOf(a.pkg);
      if (pf === '__follow__') { if (cur) return false; }
      else if (cur !== pf) return false;
    }
    switch (S.appFilter) {
      case 'sys':   return a.sys === '1';
      case 'third': return a.sys !== '1';
      case 'set':   return !!appFreqOf(a.pkg);
      case 'unset': return !appFreqOf(a.pkg);
      default:      return true;
    }
  });
}
// 图标 + 名称 + 包名 + 标签 的通用片段（分应用频率 / 线程页共用）
//   图标懒加载：先画字母头像，IntersectionObserver 滚到可见才拉 ksu://icon，失败回退字母。
//   首屏不再等所有图标，列表秒开。
function appMediaHtml(p, extraBadges) {
  const meta = Meta.cache[p.pkg] || { label: p.pkg, sys: p.sys === '1' ? 1 : 0, icon: '' };
  const label = meta.label || p.pkg;
  const sys = meta.sys === 1 ? 1 : 0;
  const badge = sys ? '<span class="pill">系统</span>' : '<span class="pill accent">第三方</span>';
  const letter = esc((label[0] || '?').toUpperCase());
  // 直接优先走官方桥图标（ksu://icon）；非官方桥拉不到时 onerror 移除自己、露出字母头像
  const icon = meta.icon
    ? '<img class="ai" src="' + esc(meta.icon) + '" alt="" onerror="this.remove()">'
    : '<img class="ai" src="ksu://icon/' + esc(p.pkg) + '" alt="" onerror="this.remove()">';
  return '<div class="ai-wrap" data-ico="' + esc(p.pkg) + '">' +
      '<span class="ai letter">' + letter + '</span>' + icon +
    '</div>' +
    '<div class="app-main">' +
      '<div class="app-name">' + esc(label) + '</div>' +
      '<div class="tagrow"><span class="app-pkg mono">' + esc(p.pkg) + '</span>' + badge + (extraBadges || '') + '</div>' +
    '</div>';
}

function renderAppFreq(keepScroll, noHydrate) {
  const win = document.getElementById('appfreq-win'); if (!win) return;
  const prevTop = keepScroll && win.scrollTop ? win.scrollTop : 0;
  const m = S.appfreq || {};
  const kw = (S.appSearch || '').trim().toLowerCase();
  const pf = S.appPresetFilter || 'all';
  const all = appfreqFiltered();

// 图标懒加载：只给「当前窗口内可见」的 .ai-wrap 拉真实图标，滚到才加载
let _iconIO = null;
function observeIcons(winId) {
  const root = document.getElementById(winId);
  if (!root) return;
  if (typeof IntersectionObserver === 'undefined') return; // 老内核兜底：直接全部尝试拉图标
  if (!_iconIO) {
    _iconIO = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const el = e.target, pkg = el.dataset.ico;
        if (pkg && !el.dataset.done) { el.dataset.done = '1'; }
        _iconIO.unobserve(el);
      });
    }, { root, rootMargin: '120px' });
  }
  root.querySelectorAll('.ai-wrap[data-ico]:not([data-done])').forEach(el => _iconIO.observe(el));
}

// 异步补全「当前可见切片」的应用名 + 图标：只请求首屏 ~40 个，避免 172 个一次性 aapt 卡死
async function hydrateVisible(kind, force) {
  if (kind === 'thread') {
    const list = currentPkgs ? currentPkgs() : [];
    const slice = list.slice(0, S.showCount || 40);
    await _loadMeta(slice);
    renderApps(true);
    observeIcons('apps-card');
  } else if (kind === 'game') {
    // ★ v18.4.2 修复：游戏页 hydrate 只重渲染「自身」（renderGame 内部带游戏过滤），
    //   绝不调 renderApps（那会渲染全部应用，覆盖游戏页 → 看起来显示所有 app）。
    //   传 true = noHydrate，避免 hydrateVisible 递归。
    const all = gameFiltered();
    const slice = all.slice(0, S.showCount || 40);
    await _loadMeta(slice);
    renderGame(true);
    observeIcons('apps-card');
  } else {
    const all = appfreqFiltered();
    const slice = all.slice(0, S.appShow || 40);
    // ★ v19.0.5：没有新名字要补（缓存已全覆盖）时**直接返回** ——
    //   旧逻辑此时仍整页重渲一次，纯属白烧（保存后又被触发一次，卡顿翻倍）。
    const before = Object.keys(Meta.cache).length;
    await _loadMeta(slice);
    if (!force && Object.keys(Meta.cache).length === before) return;
    renderAppFreq(true, true);
    observeIcons('appfreq-win');
  }
}
async function _loadMeta(slice) {
  const pkgs = slice.map(a => a.pkg).filter(p => p && !Meta.cache[p]);
  if (!pkgs.length) return;
  try { await Meta.load(pkgs); } catch (e) {}
}

// 把同一父包（com.xxx / com.xxx:sub）下的多个进程归纳为一个归并项。
// 仅当该父包存在 ≥2 个成员（主包 + 子进程，或纯多子进程）时归纳。
// 返回 [{ key, label, members:[pkg...], cur }]，cur 取主包（无冒号）的生效档，否则首个成员。
// ★ v18.4：小程序归并项的固定命名（用户要求：微信小程序 / 支付宝小程序 直接用此名）。
//   父包 → 归并项显示名；命中即直接用，不再依赖 friendly 猜测。
const MERGE_LABEL_MAP = {
  'com.tencent.mm': '微信小程序',
  'com.eg.android.AlipayGphone': '支付宝小程序'
};
function buildMergeGroups(apps) {
  const map = {};
  apps.forEach(a => {
    if (S.games && S.games.has(a.pkg)) return; // 游戏不归纳进小程序
    if (a.pkg.indexOf(':') < 0) return; // ★ v18.4.3：主包不归并，独立于主列表，可与小程序分开设置
    const key = a.pkg.split(':')[0];
    // ★ 仅微信 / 支付宝小程序（用户要求：只接受这两种；其余 :xxx 子进程不当作小程序展示）
    if (key !== 'com.tencent.mm' && key !== 'com.eg.android.AlipayGphone') return;
    (map[key] || (map[key] = [])).push(a);
  });
  const groups = [];
  Object.keys(map).forEach(key => {
    const members = map[key];
    if (members.length < 2) return; // 单子进程不归纳
    // 主包不在 members 里，取首个子进程作为代表（用于取 cur / friendly 兜底）
    const main = members.find(m => m.pkg === key) || members[0];
    // ★ v18.4：优先用固定命名（微信/支付宝小程序）；否则按 friendly/后缀 兜底。
    const label = MERGE_LABEL_MAP[key]
      || ((main.friendly && main.friendly !== key) ? (main.friendly + '小程序')
        : (key.split('.').slice(-1)[0] + '小程序'));
    groups.push({ key: key, label: label, members: members.map(m => m.pkg) });
  });
  return groups;
}
function appStatusOf(a) { return a.custom === '1' ? 'custom' : (a.defined === '1' ? 'builtin' : 'none'); }

function currentPkgs() {
  const kw = (S.appsearch || '').trim().toLowerCase();
  const tplF = S.appTplFilter || 'all';
  return S.apps.filter(a => {
    const st = appStatusOf(a);
    switch (S.appfilter) {
      case 'sys':   if (a.sys !== '1') return false; break;
      case 'third': if (a.sys === '1') return false; break;
      case 'set':   if (st === 'none') return false; break;
      case 'unset': if (st !== 'none') return false; break;
    }
    // 按「实际生效角色档」筛选（v18.3.8 修正）。
    //   旧逻辑只认 isCustom（用户手动改过的），于是「艇长已配」的内置配置应用
    //   在任何档位筛选下都直接消失 —— 筛出来的数量和真实配置对不上。
    //   现在以**实际生效**为准：自定义取 custom 配置，否则取艇长内置 tpl；
    //   两者都没有才算「跟随艇长」(auto)。fast 兼容映射到 game（与设置项一致）。
    if (tplF !== 'all') {
      const eff = a.custom === '1' ? (a.tpl || '')
        : (a.defined === '1' ? (a.tpl || '') : 'auto');
      const norm = eff === 'fast' ? 'game' : eff;
      const want = tplF === 'fast' ? 'game' : tplF;
      if (norm !== want) return false;
    }
    if (kw) {
      if (!Search.hit(a.pkg, kw)) return false;
    }
    return true;
  });
}

    String(t).split('\n').forEach(l => {
      if (l.indexOf('GF_') === 0 && l.indexOf('=') > 3) {
        const i = l.indexOf('=');
        m[l.slice(3, i)] = l.slice(i + 1).trim();
      }
    });
    S.gamefreq = m;
  } catch (e) { S.gamefreq = {}; }
}
function gameFiltered() {
  const m = S.gamefreq || {};
  const kw = (S.appSearch || '').trim().toLowerCase();
  const pf = S.appPresetFilter || 'all';
  return (S.apps || []).filter(a => {
    // ★ v18.3.9：游戏页只显示已安装的游戏
    if (!(S.games && S.games.has(a.pkg))) return false;
    if (kw && !Search.hit(a.pkg, kw)) return false;
    if (pf !== 'all') {
      const cur = m[a.pkg] || '';
      if (pf === '__follow__') { if (cur) return false; }
      else if (cur !== pf) return false;
    }
    switch (S.appfilter) {
      case 'sys':   return a.sys === '1';
      case 'third': return a.sys !== '1';
      case 'set':   return !!m[a.pkg];
      case 'unset': return !m[a.pkg];
      default:      return true;
    }
  });
}
function renderGame(noHydrate) {
  const card = document.getElementById('apps-card'); if (!card) return;
  const all = gameFiltered();
  const cnt = document.getElementById('apps-count');
  if (cnt) { cnt.textContent = all.length + ' 个'; cnt.className = 'pill'; }
  updateSelCounts();
  const list = all.slice(0, S.showCount);
  if (!list.length) { card.innerHTML = '<div class="empty">没有匹配的应用<br>换个筛选或搜索词试试</div>'; return; }
  card.innerHTML = list.map(a => {
    const cur = (S.gamefreq || {})[a.pkg] || '';
    const curCn = (APP_MODE_OPTS.find(o => o[0] === cur) || ['', '跟随全局'])[1];
    const gameTag = '<span class="pill ok">线程 · Aether 默认</span>';
    const sel = S.sel.has(a.pkg);
    const checked = sel ? ' checked' : '';
    return '<div class="row app-row' + (sel ? ' sel' : '') + '" style="display:flex;align-items:center;gap:10px">' +
      '<input type="checkbox" class="app-sel" data-sel="' + esc(a.pkg) + '"' + checked + '>' +
      appMediaHtml(a, gameTag) +
      '<button class="f modebtn" data-appset="' + esc(a.pkg) + '" data-kind="game" data-cur="' + esc(cur) + '">' + esc(curCn) + '</button>' +
    '</div>';
  }).join('');
  if (all.length > list.length) {
    card.innerHTML += '<div class="winmore" data-act="loadmore">加载更多（已显示 ' + list.length + '/' + all.length + '）</div>';
  }
  bindAppwinScroll('apps-card');
  if (!noHydrate) hydrateVisible('game');
}

// 两页统一的已选计数（置顶工具条）
function updateSelCounts() {
  const a = document.getElementById('apps-selcount');
  if (a) a.textContent = '已选 ' + S.sel.size;
  const b = document.getElementById('appfreq-selcount');
  const n = S.selSet ? S.selSet.size : 0;
  if (b) b.textContent = '已选 ' + n;
  // ★ v18.4.8：未勾选应用时，批量套用按钮置灰禁用（避免被误认成全局频率切换而误点）
  document.querySelectorAll('[data-act="freqbatch"],[data-act="gamebatch"]').forEach(btn => {
    const isGame = btn.dataset.act === 'gamebatch';
    const cnt = isGame ? S.sel.size : n;
    btn.disabled = (cnt === 0);
  });
}

async function aetherSet(pkg, tpl) {
  const r = await busy('设置中…', () => Api.aetherset(pkg, tpl));
  showToast(/OK/.test(r) ? ('已设置 ' + pkg + ' → ' + tpl) : ('失败：' + r.slice(0, 60)));
  await loadApps(); await refreshAether(); renderApps();
}
async function aetherDel(pkg) {
  const r = await busy('恢复中…', () => Api.aetherdel(pkg));
  showToast(/OK/.test(r) ? ('已恢复 ' + pkg + ' 自动分配') : ('失败：' + r.slice(0, 60)));
  await loadApps(); await refreshAether(); renderApps();
}

async function batchApply(tpl) {
  const pkgs = currentPkgs().filter(a => S.sel.has(a.pkg)).map(a => a.pkg);
  if (!pkgs.length) { showToast('请先勾选应用'); return; }
  const cn = (TPL_OPTS.find(o => o[0] === tpl) || [tpl, tpl])[1];
  const payload = pkgs.map(p => p + '\t' + tpl).join('\n');
  const b64 = b64enc(payload);
  const r = await busy('套用中…', () => Api.aethersetbatch(b64));
  if (/OK/.test(r)) {
    showToast('已套用 ' + pkgs.length + ' 个应用 → ' + cn);
    S.sel.clear();
    await loadApps(); await refreshAether(); renderApps();
  } else {
    showToast('失败：' + (r || '').slice(0, 60));
  }
}

/* ★ v18.4.8：档位选择底部弹层 —— 替代原生 select 的系统级全屏菜单，
   点击后在底部展开轻量列表，选中即回落到按钮上（不再跳「很大的下拉菜单」）。 */
function openModeSheet(title, cur, cb) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const sheet = document.createElement('div'); sheet.className = 'sheet';
  const items = APP_MODE_OPTS.map(o => {
    const on = (o[0] === cur);
    return '<div class="sheet-item' + (on ? ' on' : '') + '" data-mode="' + esc(o[0]) + '">' +
      '<div class="si-n">' + esc(o[1]) + (on ? ' <span class="pill ok">当前</span>' : '') + '</div>' +
      (o[0] ? '<div class="si-s mono">' + esc(o[0]) + '</div>' : '') + '</div>';
  }).join('');
  sheet.innerHTML =
    '<div class="sheet-h"><div class="t">' + esc(title) + '</div><button class="btn btn-xs ghost" id="sheet-close">取消</button></div>' +
    '<div class="sheet-b">' + items + '</div>';
  bg.appendChild(sheet); document.body.appendChild(bg);
  requestAnimationFrame(() => { bg.classList.add('on'); sheet.classList.add('on'); });
  const close = () => { bg.classList.remove('on'); sheet.classList.remove('on'); setTimeout(() => bg.remove(), 260); };
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  const cb2 = sheet.querySelector('#sheet-close'); if (cb2) cb2.addEventListener('click', close);
  sheet.querySelectorAll('[data-mode]').forEach(it => it.addEventListener('click', () => {
    const v = it.dataset.mode; close(); if (cb) cb(v);
  }));
}

/* ============================================================
   9) 事件绑定 + 启动
   ============================================================ */
document.addEventListener('click', async (e) => {
  const act = e.target.closest('[data-act]');
  if (act) { const fn = ACTIONS[act.dataset.act]; if (fn) { await fn(act); return; } }
  // 分应用频率 / 游戏页 的筛选 chips（两页结构一致，按当前 tab 选择渲染函数）
  const flt = e.target.closest('[data-flt]');
  if (flt) {
    const key = flt.dataset.flt;
    const isApp = S.tab === 'app';          // 应用页
    const isGame = S.tab === 'game';        // 游戏页
    const reAppFreq = isApp ? () => renderAppFreq() : () => renderGame();
    // ★ v18.3.8：cfg: 前缀 = 按「实际生效频率档」筛选，与来源/配置状态维度互斥。
    const isCfg = key.indexOf('cfg:') === 0;
    if (isCfg) {
      const want = key.slice(4);
      S.appPresetFilter = (S.appPresetFilter === want) ? 'all' : want;
      S.appFilter = 'all';
      const fSel = isApp ? '#appfreq-filters' : '#app-filters';
      const cSel = isApp ? '#appfreq-cfgfilters' : '#app-tplchips';
      document.querySelectorAll(fSel + ' .fchip').forEach(c => c.classList.toggle('on', c.dataset.flt === 'all'));
      // ★ v18.4.3 修复：cfg 高亮按「实际生效档」判定。再点取消时 appPresetFilter='all'，
      //   之前写死按 key 匹配导致高亮不随取消消失，现在同步反映筛选状态。
      const activeCfg = S.appPresetFilter; // 已在上方按点击切到新值
      document.querySelectorAll(cSel + ' .fchip').forEach(c => {
        const fk = c.dataset.flt || '';
        c.classList.toggle('on', fk === 'cfg:' + activeCfg);
      });
    }
    if (flt.closest(isApp ? '#appfreq-filters' : '#app-filters')) {
      S.appFilter = key; S.appShow = 40;
      const fSel = isApp ? '#appfreq-filters' : '#app-filters';
      document.querySelectorAll(fSel + ' .fchip').forEach(c => c.classList.toggle('on', c === flt));
      if (S.appPresetFilter !== 'all') {
        S.appPresetFilter = 'all';
        const cSel = isApp ? '#appfreq-cfgfilters' : '#app-tplchips';
        document.querySelectorAll(cSel + ' .fchip').forEach(c => c.classList.remove('on'));
      }
      const pf = document.getElementById(isApp ? 'appfreq-presetfilter' : 'app-presetfilter');
      if (pf) pf.value = 'all';
      reAppFreq();
    } else if (flt.closest(isApp ? '#appfreq-cfgfilters' : '#app-tplchips')) {
      S.appShow = 40;
      const pf = document.getElementById(isApp ? 'appfreq-presetfilter' : 'app-presetfilter');
      if (pf) pf.value = S.appPresetFilter || 'all';
      reAppFreq();
    }
    return;
  }
  // ★ v18.4.8：档位按钮（归并项 / 应用行 / 游戏行）——点开底部弹层，不再用原生 select
  //  ★ v19.0.5：保存链路瘦身 ——
  //    ① 「跟随全局」空选项真正生效（发 auto 触发后端移除自定义，旧版是空操作）；
  //    ② 无筛选/搜索时不做整页重渲，只精准刷新涉及的按钮（应用页 ~198 行）；
  //    ③ 保存成功后不再回读 appfreq/gamefreq（本地状态即真值，省两次 ksu.exec 往返）；
  //    ④ 只有失败时才回读 + 整页渲染，保证界面反映后端真实状态。
  const mb = e.target.closest('[data-merge]');
  if (mb) {
    const key = mb.dataset.merge; const kind = mb.dataset.kind; const cur = mb.dataset.cur || '';
    const grp = (S.mergeGroups || []).find(g => g.key === key);
    if (!grp) return;
    openModeSheet(grp.label + '（' + grp.members.length + ' 个进程）', cur, async (val) => {
      const v = val || 'auto';   // 空 = 跟随全局 → auto（移除自定义）
      const full = (S.appPresetFilter !== 'all') || !!(S.appSearch || '').trim();
      grp.members.forEach(p => { if (S.appfreq) S.appfreq[p] = (v === 'auto' ? '' : v); });
      if (full) renderAppFreq(); else grp.members.forEach(p => refreshModeButtons(p));
      const rows = grp.members.map(p => p + '\t' + v);
      const r = await busy('保存中…', () => Api.appsetbatch(b64enc(rows.join('\n')), kind));
      if (/OK/.test(r)) {
        showToast('已设「' + grp.label + '」→ ' + (v === 'auto' ? '跟随全局' : (MODE_CN[v] || v)) + '（' + grp.members.length + ' 个进程同步）');
      } else {
        showToast('失败：' + (r || '').slice(0, 60));
        await loadAppFreq(); renderAppFreq();
      }
    });
    return;
  }
  const ab = e.target.closest('[data-appset]');
  if (ab) {
    const pkg = ab.dataset.appset; const kind = ab.dataset.kind; const cur = ab.dataset.cur || '';
    openModeSheet((kind === 'game' ? '游戏 · ' : '应用 · ') + pkg, cur, async (val) => {
      const v = val || 'auto';   // 空 = 跟随全局 → auto（移除自定义）
      if (kind === 'game') {
        // 游戏页：条目少，保留整页渲染（正确性优先）
        if (S.gamefreq) S.gamefreq[pkg] = (v === 'auto' ? '' : v);
        renderGame();
        const r = await busy('保存中…', () => Api.appsetbatch(b64enc(pkg + '\t' + v), 'game'));
        if (/OK/.test(r)) {
          showToast('已设为游戏[' + (v === 'auto' ? '跟随全局' : (MODE_CN[v] || v)) + ']（频率+线程同步）');
        } else {
          showToast('失败：' + (r || '').slice(0, 60));
        }
        await loadGameFreq(); renderGame();
        return;
      }
      // 应用页：精准更新，无筛选/搜索才走快路径
      const full = (S.appPresetFilter !== 'all') || !!(S.appSearch || '').trim();
      if (S.appfreq) S.appfreq[pkg] = (v === 'auto' ? '' : v);
      if (full) renderAppFreq(); else refreshModeButtons(pkg);
      const r = await busy('保存中…', () => Api.appsetbatch(b64enc(pkg + '\t' + v), 'app'));
      if (/OK/.test(r)) {
        showToast('已设为应用[' + (v === 'auto' ? '跟随全局' : (MODE_CN[v] || v)) + ']（频率+线程同步）');
      } else {
        showToast('失败：' + (r || '').slice(0, 60));
        await loadAppFreq();
        if (full) renderAppFreq(); else refreshModeButtons(pkg);
      }
    });
    return;
  }
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; render(); return; }
});

document.addEventListener('change', async (e) => {
  // 两页「按预设筛选」下拉
  if (e.target.id === 'appfreq-presetfilter') {
    S.appPresetFilter = e.target.value; S.appShow = 40; renderAppFreq(); return;
  }
  if (e.target.id === 'app-presetfilter') {
    S.appPresetFilter = e.target.value; S.showCount = 40; renderGame(); return;
  }
  const sel = e.target.closest('[data-sel]');
  if (sel && sel.closest('#apps-card')) {
    const pkg = sel.dataset.sel;
    if (sel.checked) S.sel.add(pkg); else S.sel.delete(pkg);
    const row = sel.closest('.app-row');
    if (row) row.classList.toggle('sel', sel.checked);
    updateSelCounts();
    return;
  }
  const feat = e.target.closest('[data-feat]');
  if (feat) {
    const k = feat.dataset.feat; const v = feat.checked ? 'true' : 'false';
    const ok = await toggleAetherFeat(k, v);
    if (!ok) { feat.checked = !feat.checked; }
    else { if (S.aether) S.aether['FEAT_' + k] = v; }
    return;
  }
});

document.addEventListener('input', (e) => {
  // ★ v18.3.8：搜索除本地过滤外，还要触发「候选集 label 强制补全」。
  //   过去只有本地过滤，中文名没 hydrate 就永远搜不到（详见 Search 注释）。
  if (e.target.id === 'app-search') {
    S.appsearch = e.target.value.trim().toLowerCase();
    if (S.tab === 'game') renderGame(); else renderApps();
    if (S.appsearch) Search.schedule('thread');
  }
  if (e.target.id === 'appfreq-search') {
    S.appSearch = e.target.value.trim().toLowerCase(); S.appShow = 40; renderAppFreq();
    if (S.appSearch) Search.schedule('appfreq');
  }
});

window.addEventListener('scroll', () => {
  const h = document.querySelector('header'); if (h) h.classList.toggle('scrolled', window.scrollY > 8);
}, { passive: true });

// 应用列表窗口：滚动到底自动加载更多（无限滚动）。
// ⚠ 嵌套 .appwin 的 scroll 事件不会冒泡到 document，必须直接绑到该元素上。
function bindAppwinScroll(id, moreAct) {
  const win = document.getElementById(id); if (!win) return;
  if (win._winBound) return;            // 视图内元素稳定，只绑一次
  win._winBound = true;
  win.addEventListener('scroll', () => {
    if (win.scrollTop + win.clientHeight >= win.scrollHeight - 48) {
      const more = win.querySelector('.winmore');
      if (more && !more.classList.contains('loading')) { more.classList.add('loading'); more.click(); }
    }
  }, { passive: true });
}

(async function boot() {
  const mode = await Bridge.probe();
  const banner = document.getElementById('demo-banner');
  if (mode === 'demo' && banner) banner.classList.remove('hidden');
  const ver = document.getElementById('ver');
  if (ver) ver.textContent = (S.status.VER || '17.12').replace(/^\S+\s/, '').trim() || '17.12';
  // ★ v18.4.2：防 WebView 缓存——版本戳变化则提示刷新，避免旧 index.html 静默生效
  const WV = 'v18.4.8';
  try {
    const old = localStorage.getItem('webui_ver');
    if (old && old !== WV) {
      showToast('界面已更新（' + old + '→' + WV + '），请下拉/重进本页以加载新版');
    }
    localStorage.setItem('webui_ver', WV);
  } catch (e) {}
  render();
})();
</script>
</body>
</html>
